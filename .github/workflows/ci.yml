name: CI

on:
  push:
  pull_request:

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.4
          channel: stable
          cache: true

      - name: Package — pub get
        run: flutter pub get

      - name: Package — analyze
        run: flutter analyze

      - name: Package — test
        run: flutter test

      - name: Example — pub get
        working-directory: example
        run: flutter pub get

      - name: Example — analyze
        working-directory: example
        run: flutter analyze

      - name: Example — test
        working-directory: example
        run: flutter test
